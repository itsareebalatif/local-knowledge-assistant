[project]
name = "personal-knowledge-engine"
version = "0.1.0"
description = "Local, privacy-first AI knowledge assistant (hybrid RAG + lightweight knowledge graph)."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pypdf>=4.2,<5.0",
    "pdfplumber>=0.11,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "python-docx>=1.1,<2.0",
    "aiofiles>=23.2,<24.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<0.1",
    "chromadb>=0.5,<0.6",
    "networkx>=3.2,<4.0",
    "spacy>=3.7,<3.8",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.1,<3.0",
    # Pinned below chromadb's own tokenizers<=0.20.3 ceiling — a plain
    # `pip install sentence-transformers` pulls transformers>=4.57, which
    # requires tokenizers>=0.22 and breaks chromadb. transformers<4.46 is
    # the newest line still compatible with tokenizers<=0.20.3.
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<4.46",
    "tokenizers>=0.13.2,<=0.20.3",
]

[project.scripts]
kengine = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "fpdf2>=2.7,<3.0",
]
streamlit = [
    "streamlit>=1.38,<2.0",
    "requests>=2.31,<3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
