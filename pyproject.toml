[project]
name = "personal-knowledge-engine"
version = "0.1.0"
description = "Local, privacy-first AI knowledge assistant (hybrid RAG + lightweight knowledge graph)."
# LangGraph's per-node stream writer (app/llm/rag_graph.py) relies on
# contextvar propagation across async nodes, which is unreliable before
# Python 3.11 — confirmed live: on 3.10 it raises "Called get_config outside
# of a runnable context" from inside an async node. CI already runs 3.11.
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pypdf>=4.2,<5.0",
    "pdfplumber>=0.11,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "python-docx>=1.1,<2.0",
    "aiofiles>=23.2,<24.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<0.1",
    "chromadb>=0.5,<0.6",
    "networkx>=3.2,<4.0",
    "spacy>=3.7,<3.8",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.1,<3.0",
    "langfuse>=4.0,<5.0",
    "certifi>=2024.0.0",
    # langgraph-rag branch only: re-expresses the query-answering pipeline's
    # orchestration (route -> retrieve -> guardrail -> generate -> guardrail)
    # as a LangGraph graph, see app/llm/rag_graph.py. Not used anywhere else.
    "langgraph>=1.0,<2.0",
    # Persists each conversation's graph execution state to disk, keyed by
    # thread_id (= conversation_id) — see app/main.py's lifespan and
    # app/llm/orchestration.py. Lets a trace be replayed/inspected after the
    # fact (graph.aget_state_history), not just watched live in Langfuse.
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    # Pinned to the exact line chromadb's own otel extras want — a plain
    # `pip install langfuse` pulls newer opentelemetry-sdk/-api/-proto/
    # -semantic-conventions than chromadb[otlp-proto-grpc,instrumentation-
    # fastapi] declares, which breaks pip check even though both sides
    # import fine. These versions satisfy both.
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-common==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-proto==1.45.0",
    "opentelemetry-semantic-conventions==0.66b0",
    "opentelemetry-exporter-otlp-common==0.66b0",
]

[project.scripts]
kengine = "app.cli:main"

[project.optional-dependencies]
# Pulls in sentence-transformers + transformers + torch (~650MB installed) for
# the cross-encoder reranker (app/search/reranker.py) — a real relevance
# improvement, but by far the single heaviest dependency in this project.
# RERANK_ENABLED=false (or just not installing this extra) skips it entirely;
# retrieval falls back to RRF's own ordering. CrossEncoderReranker's own
# import of sentence_transformers is already lazy (inside __init__, not at
# module level), and app/main.py only constructs it when RERANK_ENABLED is
# true, so the base install never needs this extra at all unless you want it.
rerank = [
    # Pinned below chromadb's own tokenizers<=0.20.3 ceiling — a plain
    # `pip install sentence-transformers` pulls transformers>=4.57, which
    # requires tokenizers>=0.22 and breaks chromadb. transformers<4.46 is
    # the newest line still compatible with tokenizers<=0.20.3.
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<4.46",
    "tokenizers>=0.13.2,<=0.20.3",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "fpdf2>=2.7,<3.0",
    "personal-knowledge-engine[rerank]",  # the test suite covers CrossEncoderReranker, so dev needs it too
]
streamlit = [
    "streamlit>=1.38,<2.0",
    "requests>=2.31,<3.0",
    # spacy/thinc (the entity-extraction stack) are compiled against
    # numpy<2.0 and crash on import otherwise — confirmed live: pyarrow>=19
    # requires numpy>=2.0 at its own C-extension import time, which pip
    # doesn't flag as a conflict (pyarrow's numpy floor isn't a declared
    # metadata constraint, just an ImportError at runtime), so a plain
    # `pip install streamlit` silently pulls a pyarrow that breaks
    # st.write_stream() the moment it's called. Pinned below that floor.
    "pyarrow<19",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without this, `import app` only works by accident locally — dev machines
# that ran `pip install -e .` at some point have it registered on sys.path
# regardless of how pytest is invoked, but a fresh CI checkout installing
# only from requirements.txt has nothing providing it. This makes pytest
# add the repo root to sys.path itself, independent of whether the package
# is pip-installed at all, so collection works the same everywhere.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires `Depends(...)` (and
# Query/Path/Body/etc.) as an actual argument default — that's not the
# mutable-default-argument bug B008 exists to catch, it's how FastAPI
# resolves dependencies per-request. Without this, every route signature
# in app/api/*.py (38 of them) flags as a false positive.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]
