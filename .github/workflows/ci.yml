name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install dependencies ignoring hash/direct-url conflicts
          pip install --no-build-isolation -r requirements.txt || pip install -r requirements.txt --use-pep517
          # Download spacy language model directly via spacy cli
          python -m spacy download en_core_web_sm
          pip install pytest ruff
          
      - name: Lint and check syntax
        run: ruff check .

      - name: Run test suite
        env:
          OPENAI_API_KEY: "mock-key-for-unit-tests"
        run: pytest -q