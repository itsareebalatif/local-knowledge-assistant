services:
  api:
    build:
      context: .
      # Leave empty for the lean image (no reranker). Set to "rerank" to
      # include the cross-encoder reranker — adds ~650-700MB to the image.
      args:
        INSTALL_EXTRAS: ""
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Matches the build above by default — override here (or in .env) if
      # you built with INSTALL_EXTRAS=rerank and actually want it running.
      RERANK_ENABLED: "false"
    volumes:
      # Persists the SQLite DB, Chroma vector store, and the graph pickle
      # across container restarts/rebuilds — this is the only state that
      # needs to survive; everything else is reproducible from the image.
      - ./data:/app/data
    restart: unless-stopped

  # If LLM_BACKEND or EMBEDDING_BACKEND is "local" (the default), the api
  # container needs a reachable Ollama. This project doesn't bundle one here
  # on purpose — Ollama ships its own, separately-sized image and model
  # downloads (often several GB per model) that would work directly against
  # this image's "minimum space" goal. Run Ollama on the host (as in local
  # dev) and set OLLAMA_BASE_URL in .env to reach it — on macOS/Windows
  # Docker Desktop that's typically http://host.docker.internal:11434; on
  # Linux, http://172.17.0.1:11434 or your host's actual LAN/bridge address.
  # To containerize it anyway: uncomment below and point OLLAMA_BASE_URL at
  # http://ollama:11434 instead.
  #
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #
  # volumes:
  #   ollama_models:
